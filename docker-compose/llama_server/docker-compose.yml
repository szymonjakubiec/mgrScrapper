services:
  llama-server:
    build: .
    container_name: llama_api
    ports:
      - "8000:8000"
    volumes:
      - ./models:/models
    command: >
      --model /models/Llama-3.2-3B-Instruct-Q4_K_M.gguf
      --n_ctx 4096
      --n_gpu_layers -1
      --host 0.0.0.0
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    stdin_open: true
    tty: true